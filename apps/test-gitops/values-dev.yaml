# Dev environment values for test-gitops.
# Overrides chart/values.yaml from https://github.com/taha-idp-lab/test-gitops
image:
  # The first CI run publishes the image a few minutes after the repository is created.
  # Until then the pod retries the pull (ImagePullBackOff is expected for a short while).
  tag: "30b03097074af4ee4218a92ff12fcfae12859047"
  pullPolicy: IfNotPresent
replicaCount: 1
